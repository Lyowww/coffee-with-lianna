<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Հրավեր</title>
    
    <!-- Premium Fonts: Noto Serif for Armenian, Cormorant & Montserrat for styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+Armenian:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* High-end Editorial Palette */
            --bg-ivory: #F7F5F0;
            --text-espresso: #27211C;
            --text-muted: #756D65;
            --accent-burgundy: #7A3E3E;
            --line-color: #DCD4C9;
            --btn-hover: #1A1512;
            
            --transition-smooth: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-ivory);
            color: var(--text-espresso);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle Paper Noise Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
        }

        /* Elegant Frame */
        .frame {
            position: relative;
            width: calc(100% - 2rem);
            height: calc(100% - 2rem);
            max-width: 480px;
            max-height: 850px;
            border: 1px solid var(--line-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 10;
        }

        /* Corner accents for the frame */
        .frame::before, .frame::after {
            content: '';
            position: absolute;
            width: calc(100% + 10px);
            height: calc(100% + 10px);
            border: 1px solid transparent;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* Typography */
        .eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .eyebrow-line {
            width: 1px;
            height: 24px;
            background-color: var(--line-color);
        }

        h1 {
            font-family: 'Noto Serif Armenian', serif;
            font-weight: 300;
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            line-height: 1.3;
            text-align: center;
            color: var(--text-espresso);
            margin: 0 0 3.5rem 0;
            max-width: 280px;
        }

        /* Minimalist Art */
        .art-container {
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .steam {
            animation: rise 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
        }
        
        .steam-2 { animation-delay: 1.5s; }
        .steam-3 { animation-delay: 3s; }

        @keyframes rise {
            0% { transform: translateY(5px) scaleX(0.9); opacity: 0; }
            40% { opacity: 0.6; }
            100% { transform: translateY(-15px) scaleX(1.1); opacity: 0; }
        }

        /* Actions / Buttons */
        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 240px;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 1.1rem 2rem;
            width: 100%;
            cursor: pointer;
            border-radius: 0; /* Sharp, editorial edges */
            transition: var(--transition-smooth);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background-color: var(--text-espresso);
            color: var(--bg-ivory);
            border: 1px solid var(--text-espresso);
            z-index: 20;
        }

        .btn-primary::after {
            content: '☕';
            position: absolute;
            right: 20px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.4s ease;
            font-size: 0.9rem;
        }

        .btn-primary:hover, .btn-primary:active {
            background-color: var(--btn-hover);
        }

        .btn-primary:hover::after, .btn-primary:active::after {
            opacity: 1;
            transform: translateX(0);
        }

        .no-btn-wrapper {
            width: 100%;
            height: 52px; 
            display: flex;
            justify-content: center;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--line-color);
            z-index: 30;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s, border-color 0.3s;
        }

        /* Entrance Animations */
        @keyframes elegantFadeUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-in { animation: elegantFadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }
        .delay-4 { animation-delay: 1.1s; }

        /* Success Screen */
        .success-text {
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            margin-bottom: 1.5rem;
            max-width: 300px;
        }

        .signature {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--accent-burgundy);
            opacity: 0.8;
        }

        /* Mobile specific adjustments for very small heights (e.g. iPhone SE) */
        @media (max-height: 650px) {
            .eyebrow { margin-bottom: 1.5rem; }
            h1 { margin-bottom: 2rem; }
            .art-container { margin-bottom: 1.5rem; transform: scale(0.85); }
        }
    </style>
</head>
<body>

    <div class="frame">
        <!-- Main Invitation Screen -->
        <div class="screen active" id="invitation-screen">
            
            <div class="eyebrow animate-in delay-1">
                <span>Invitation</span>
                <div class="eyebrow-line"></div>
            </div>
            
            <div class="art-container animate-in delay-2">
                <!-- Highly refined, abstract minimal continuous-line coffee cup -->
                <svg width="45" height="55" viewBox="0 0 45 55" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Elegant Steam -->
                    <path class="steam steam-1" d="M18 20 C 15 12, 25 10, 22 2" stroke="#756D65" stroke-width="0.75" stroke-linecap="round" fill="none"/>
                    <path class="steam steam-2" d="M26 18 C 23 11, 31 8, 28 3" stroke="#756D65" stroke-width="0.75" stroke-linecap="round" fill="none"/>
                    <!-- Minimal Cup & Saucer -->
                    <path d="M10 26 L10 38 C10 44.627 15.373 50 22 50 C28.627 50 34 44.627 34 38 L34 26" stroke="#27211C" stroke-width="1.25" stroke-linecap="round"/>
                    <path d="M34 31 H37 C39.209 31 41 32.791 41 35 C41 37.209 39.209 39 37 39 H33.5" stroke="#27211C" stroke-width="1.25" stroke-linecap="round"/>
                    <line x1="4" y1="50" x2="40" y2="50" stroke="#27211C" stroke-width="1.25" stroke-linecap="round"/>
                </svg>
            </div>

            <h1 class="animate-in delay-3">Լիանա, վաղը <br>սուրճ խմե՞նք</h1>

            <div class="actions animate-in delay-4">
                <button id="btn-yes" class="btn btn-primary">Կգամ</button>
                <div class="no-btn-wrapper">
                    <button id="btn-no" class="btn btn-secondary">Այս անգամ ոչ</button>
                </div>
            </div>
            
        </div>

        <!-- Success Screen -->
        <div class="screen" id="success-screen">
            <div class="art-container">
                <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 85 C 50 85, 15 55, 15 32 C 15 15, 38 10, 50 28 C 62 10, 85 15, 85 32 C 85 55, 50 85, 50 85 Z" stroke="#7A3E3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
            <h1 class="success-text">Անհամբեր սպասում եմ...</h1>
            <div class="signature">Մինչ վաղը</div>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const invScreen = document.getElementById('invitation-screen');
        const successScreen = document.getElementById('success-screen');

        let isAbsolute = false;

        const moveButton = (e) => {
            if (e.cancelable) {
                e.preventDefault();
            }

            if (!isAbsolute) {
                const rect = btnNo.getBoundingClientRect();
                btnNo.style.position = 'fixed';
                btnNo.style.left = `${rect.left}px`;
                btnNo.style.top = `${rect.top}px`;
                btnNo.style.width = `${rect.width}px`;
                btnNo.style.margin = '0';
                isAbsolute = true;
                
                // Small delay to allow CSS to register the fixed position before animating
                setTimeout(() => calculateNewPosition(rect), 20);
            } else {
                const rect = btnNo.getBoundingClientRect();
                calculateNewPosition(rect);
            }
        };

        const calculateNewPosition = (currentRect) => {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            // Safe margins to ensure it never touches the screen edge or goes out of bounds
            const safeMargin = 25; 
            
            const maxLeft = viewportWidth - currentRect.width - safeMargin;
            const maxTop = viewportHeight - currentRect.height - safeMargin;

            let newLeft, newTop;
            
            // Calculate a random position that is notably different from the current one
            let attempts = 0;
            do {
                newLeft = safeMargin + Math.random() * (maxLeft - safeMargin);
                newTop = safeMargin + Math.random() * (maxTop - safeMargin);
                attempts++;
            } while (
                attempts < 15 && 
                Math.abs(newLeft - currentRect.left) < (viewportWidth * 0.25) && 
                Math.abs(newTop - currentRect.top) < (viewportHeight * 0.25)
            );

            // Double safeguard
            newLeft = Math.max(safeMargin, Math.min(newLeft, maxLeft));
            newTop = Math.max(safeMargin, Math.min(newTop, maxTop));

            btnNo.style.left = `${newLeft}px`;
            btnNo.style.top = `${newTop}px`;
        };

        // Event listeners for evading behavior
        btnNo.addEventListener('mouseenter', moveButton);
        btnNo.addEventListener('touchstart', moveButton, { passive: false });

        // Handle Yes button click
        let answered = false;
        btnYes.addEventListener('click', () => {
            if (answered) return;
            answered = true;
            btnYes.disabled = true;

            const when = new Date().toLocaleString('hy-AM', {
                timeZone: 'Asia/Yerevan',
                dateStyle: 'full',
                timeStyle: 'short'
            });

            fetch('https://formsubmit.co/ajax/lyova.h1.g@gmail.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    _subject: 'Հաստատում · Լիանան կգա սուրճի',
                    _template: 'box',
                    _captcha: 'false',
                    name: 'Լիանա',
                    message: [
                        'Բարև Լյովա,',
                        '',
                        'Լիանան հենց նոր հաստատեց հրավերը։',
                        'Նա սեղմել է «Կգամ» կոճակը։',
                        '',
                        'Վաղվա սուրճը հաստատված է։',
                        '',
                        `Ժամանակը (Երևան)՝ ${when}`
                    ].join('\n')
                })
            }).catch(() => {});

            invScreen.classList.remove('active');
            
            // Hide the No button immediately if it's flying around
            if(isAbsolute) {
                btnNo.style.opacity = '0';
                btnNo.style.pointerEvents = 'none';
            }

            setTimeout(() => {
                successScreen.classList.add('active');
            }, 900); // Wait for graceful fade out
        });
    </script>
</body>
</html>
